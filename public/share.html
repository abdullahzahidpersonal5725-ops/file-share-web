<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Shared File — Abdullah Drive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#030308;
      --surface:rgba(15, 15, 28, 0.85);
      --border:rgba(255, 255, 255, 0.12);
      --neon-magenta:#ff007f;
      --neon-cyan:#00f0ff;
      --neon-lime:#00ff87;
      --neon-yellow:#ffb700;
      --neon-purple:#8a2be2;
      --text:#f8fafc;
      --text-dim:#94a3b8;
      --text-bright:#ffffff;
      --success:#00ff87;
      --danger:#ff2a5f;
      --radius-lg:24px;
      --radius-sm:10px;
      --shadow-neon:0 0 45px rgba(255,0,127,0.45);
      --font:'Outfit',sans-serif;
      --font-code:'Space Grotesk',sans-serif;
    }
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative}
    .bg-glow{position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:750px;height:750px;background:radial-gradient(circle,rgba(255,0,127,0.2) 0%,rgba(138,43,226,0.1) 50%,transparent 70%);pointer-events:none}
    .share-card{background:var(--surface);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--border);border-radius:var(--radius-lg);padding:48px 40px;max-width:500px;width:100%;text-align:center;position:relative;z-index:1;animation:slideUp 0.4s ease;box-shadow:var(--shadow-neon)}
    .share-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--neon-cyan),var(--neon-magenta),var(--neon-lime))}
    .share-icon{font-size:4.8rem;margin-bottom:18px;display:block;filter:drop-shadow(0 0 25px rgba(255,0,127,0.5))}
    .share-title{font-size:1.6rem;font-weight:900;color:var(--text-bright);margin-bottom:12px;word-break:break-word}
    .share-meta{color:var(--text-dim);font-size:0.92rem;margin-bottom:32px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-weight:700}
    .share-meta span{display:flex;align-items:center;gap:6px}
    .download-btn{display:inline-block;background:linear-gradient(135deg,var(--neon-magenta),var(--neon-purple),var(--neon-cyan));color:#fff;padding:16px 48px;border-radius:var(--radius-sm);font-weight:900;font-size:1.05rem;border:none;cursor:pointer;transition:all 0.3s;text-decoration:none;box-shadow:var(--shadow-neon);font-family:inherit}
    .download-btn:hover{transform:scale(1.04);box-shadow:0 0 50px rgba(0,240,255,0.6)}
    .powered-by{color:var(--text-dim);font-size:0.85rem;margin-top:32px;font-weight:600}
    .powered-by a{color:var(--neon-cyan);text-decoration:none;font-weight:800}
    .error-state{color:var(--danger);font-size:1.05rem;font-weight:800}
    .loading{color:var(--text-dim);font-weight:700}
    @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:480px){.share-card{padding:32px 22px}}
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="share-card" id="shareCard">
    <div class="loading" id="loadingState">Loading file info...</div>
  </div>

  <script>
    const token = window.location.pathname.split('/share/')[1];

    function formatSize(bytes) {
      if (!bytes) return '0 B';
      const units = ['B','KB','MB','GB','TB'];
      let i = 0;
      while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
      return bytes.toFixed(i ? 1 : 0) + ' ' + units[i];
    }

    function getFileIcon(name) {
      const ext = name.split('.').pop().toLowerCase();
      const icons = {pdf:'📄',doc:'📝',docx:'📝',txt:'📃',jpg:'🖼️',jpeg:'🖼️',png:'🖼️',gif:'🖼️',svg:'🖼️',mp4:'🎬',mp3:'🎵',zip:'📦',rar:'📦','7z':'📦',js:'💻',py:'💻'};
      return icons[ext] || '📎';
    }

    let verifiedPassword = '';

    async function loadShareInfo() {
      try {
        const res = await fetch(`/api/share/${token}`);
        const data = await res.json();
        const card = document.getElementById('shareCard');

        if (!data.success) {
          card.innerHTML = `
            <span class="share-icon">❌</span>
            <div class="error-state">${data.error || 'File not found'}</div>
            <div class="powered-by">Powered by <a href="/">Abdullah File Share</a></div>`;
          return;
        }

        const f = data.file;

        if (f.isProtected && !verifiedPassword) {
          card.innerHTML = `
            <span class="share-icon">🔒</span>
            <div class="share-title">${escapeHtml(f.originalName)}</div>
            <p style="color:var(--text-dim);font-size:0.9rem;margin-bottom:16px">This shared file is password protected. Enter passcode to access.</p>
            <input type="password" id="sharePassInput" placeholder="Enter file password" style="width:100%;padding:12px 16px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:var(--radius-sm);color:#fff;font-size:0.95rem;outline:none;margin-bottom:14px" onkeydown="if(event.key==='Enter')verifySharePass()">
            <div id="passErr" style="color:var(--danger);font-size:0.85rem;margin-bottom:12px;display:none"></div>
            <button onclick="verifySharePass()" class="download-btn" style="width:100%">Unlock & Download</button>
            <div class="powered-by">Powered by <a href="/">Abdullah File Share</a></div>`;
          return;
        }

        card.innerHTML = `
          <span class="share-icon">${getFileIcon(f.originalName)}</span>
          <div class="share-title">${escapeHtml(f.originalName)}</div>
          <div class="share-meta">
            <span>${formatSize(f.size)}</span>
            <span>${new Date(f.uploadDate).toLocaleDateString()}</span>
            <span>${f.downloads || 0} downloads</span>
          </div>
          <a href="/api/share-download/${token}${verifiedPassword ? '?password=' + encodeURIComponent(verifiedPassword) : ''}" class="download-btn">Download File</a>
          <div class="powered-by">Powered by <a href="/">Abdullah File Share</a></div>`;
      } catch (err) {
        document.getElementById('shareCard').innerHTML = `
          <span class="share-icon">⚠️</span>
          <div class="error-state">Failed to load file info</div>
          <div class="powered-by">Powered by <a href="/">Abdullah File Share</a></div>`;
      }
    }

    async function verifySharePass() {
      const pass = document.getElementById('sharePassInput').value.trim();
      const errEl = document.getElementById('passErr');
      if (!pass) { errEl.textContent = 'Please enter password'; errEl.style.display = 'block'; return; }

      try {
        const res = await fetch(`/api/share/${token}/verify-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pass })
        });
        const data = await res.json();
        if (data.success && data.valid) {
          verifiedPassword = pass;
          loadShareInfo();
        } else {
          errEl.textContent = data.error || 'Incorrect password';
          errEl.style.display = 'block';
        }
      } catch (e) {
        errEl.textContent = 'Verification failed';
        errEl.style.display = 'block';
      }
    }

    loadShareInfo();
  </script>
  <div class="creator-credit" style="text-align: center; margin-top: 40px; padding-bottom: 20px; color: var(--text-dim); font-size: 0.9rem; font-weight: 500; opacity: 0.8; width: 100%;">Created by Abdullah</div>
</body>
</html>
